# ==============================================================================
# AI-DEV-TOOLS CONFIGURATION (DEFAULT: FULL FUNCTIONALITY & FULL LINTING)
# ==============================================================================
# Complete documentation: docs/power-users/yaml-guide.md
# Quickstart guide: docs/user/quickstart.md

version: 1

# Scope of configuration: 'workspace' (current project only) or 'global' (user home directory)
scope: workspace

# File modification mode:
# - 'append': Preserves existing file content; inserts or updates the marked AI-DEV-TOOLS block.
# - 'overwrite': Replaces the entire file; creates an automatic .bak backup of the original file.
# - 'skip': Preserves existing files unchanged; only creates missing target files.
write_mode: append

# Target AI assistants to configure
# Toggle assistants individually or run 'adt detect' to auto-select only assistants found in this workspace.
tools:
  claude: true       # Anthropic Claude Code CLI & Claude Desktop (CLAUDE.md)
  cursor: true       # Cursor IDE (.cursorrules & .cursor/rules/)
  cline: true        # Cline & Roo Code VS Code extension (.clinerules)
  antigravity: true  # Google Antigravity & Agent tools (AGENTS.md)
  codex: true        # OpenAI Codex & ChatGPT developer tools (.codex/)
  windsurf: true     # Codeium Windsurf IDE (.windsurfrules)
  copilot: true      # GitHub Copilot (.github/copilot-instructions.md)
  aider: true        # Aider paired programming assistant (.aider.conventions.md)

# Rule Profile: Controls linter strictness and instruction depth
# Built-in profile levels:
# - 'strict': Default verification (91 rules: AST safety, typing, anti-slop, formatting, clean structure)
# - 'standard': Core safety, relaxes comment length and math variables
# - 'safe': Essential runtime safety (crashes, bad syntax, hallucinated imports, secrets)
# - 'minimal': Critical runtime guards only
profile:
  level: strict
  skip_rules: []
  description: "Full functionality and strict linting. Enforces AST safety, anti-AI style, and code quality."

# Specific instruction file targets (toggle individually)
targets:
  claude_md: true
  agents_md: true
  cursorrules: true
  clinerules: true
  windsurfrules: true
  aider_conventions: true
  copilot_instructions: true

# Model Context Protocol (MCP) server configuration
# Registers repository tools with MCP clients (Claude Desktop, Cursor, Antigravity, Windsurf).
# Scoped to repository root for read-only search, AST inspection, and linter diagnostics.
mcp:
  enabled: true
  server_name: ai-dev-tools

# AI agent skills configuration
# Installs specialized agent skills (debugging, review, testing, encoding) into target assistant folders.
# Available bundles: 'all' (all 20+ skills), 'core', 'architecture', 'context', 'workflow', 'none'
skills:
  enabled: true
  bundle: all
  custom_skills: []

# Git hooks automation
# Runs fast diff-scoped linter verification on staged files before git commits.
hooks:
  git_pre_commit: true
  command: "uv run --no-project python scripts/claudemd_linter.py . --diff"
