# Canonical 4-Stage CI/CD Blueprint (Template Reference)
# Copy into .github/workflows/ci.yml and customize build steps per repository stack.
name: CI & Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lint:
    name: Strict Linter & Link Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout ai-dev-tools
        uses: actions/checkout@v4
        with:
          repository: DontKwo/ai-dev-tools
          path: .toolchain/ai-dev-tools

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run strict linter audit
        run: |
          uv run --no-project python .toolchain/ai-dev-tools/scripts/claudemd_linter.py . --level strict --full

      - name: Run documentation link audit
        run: |
          uv run --no-project python .toolchain/ai-dev-tools/scripts/link_checker.py .

  test:
    name: Automated Test Suite
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run project tests
        run: echo "Replace with stack test runner (pytest / unittest / npm test / cargo test / gradlew test / Invoke-Pester)"

  build:
    name: Build & Self-Test Artifacts
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and self-test target executable
        run: echo "Replace with platform binary build + --self-test check"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: release-dist/*
          if-no-files-found: error

  release:
    name: Publish Semantic Release
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release assets
        run: |
          mkdir -p release-dist
          find artifacts -type f -exec cp {} release-dist/ \;

      - name: Resolve auto-incrementing vX.Y.Z release tag
        id: version
        run: |
          python3 -c '
          import os, re, subprocess
          subprocess.run(["git", "fetch", "--tags", "--force"], check=True)
          def parse_ver(s):
              m = re.match(r"^v?(\d+)\.(\d+)\.(\d+)$", s.strip())
              return (int(m.group(1)), int(m.group(2)), int(m.group(3))) if m else None
          raw_tags = subprocess.check_output(["git", "tag", "--list", "v*"], text=True).splitlines()
          existing = {t.strip() for t in raw_tags if t.strip()}
          parsed = [parse_ver(t) for t in existing]
          parsed = [v for v in parsed if v]
          ref = os.environ.get("GITHUB_REF", "")
          head_tags = [parse_ver(t) for t in subprocess.check_output(["git", "tag", "--points-at", "HEAD", "--list", "v*"], text=True).splitlines()]
          head_tags = [v for v in head_tags if v]
          if ref.startswith("refs/tags/v"):
              target = parse_ver(ref[len("refs/tags/"):]) or (0, 1, 0)
          elif head_tags:
              target = sorted(head_tags)[-1]
          else:
              highest = max(parsed) if parsed else (0, 1, 0)
              candidate = f"v{highest[0]}.{highest[1]}.{highest[2]}"
              if candidate in existing:
                  highest = (highest[0], highest[1], highest[2] + 1)
              target = highest
          tag = f"v{target[0]}.{target[1]}.{target[2]}"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"tag={tag}\n")
          print(f"Resolved tag={tag}")
          '

      - name: Tag commit on main
        if: startsWith(github.ref, 'refs/heads/main')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "${{ steps.version.outputs.tag }}" "${{ github.sha }}"
          git push -f origin "${{ steps.version.outputs.tag }}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "<AppName> ${{ steps.version.outputs.tag }}"
          target_commitish: ${{ github.sha }}
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: |
            release-dist/*
